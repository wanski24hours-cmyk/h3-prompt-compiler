[project]
name = "h3-prompt-compiler"
version = "1.2.0"
description = "Mode-aware Chinese director-draft Context-IR compiler and hard auditor for MiniMax H3 ComfyUI workflows"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]

[project.urls]
Repository = "https://github.com/wanski24hours-cmyk/h3-prompt-compiler"
Issues = "https://github.com/wanski24hours-cmyk/h3-prompt-compiler/issues"

[tool.comfy]
PublisherId = "h3-tools"
DisplayName = "H3 Prompt Compiler"

[tool.pytest.ini_options]
testpaths = ["tests"]
